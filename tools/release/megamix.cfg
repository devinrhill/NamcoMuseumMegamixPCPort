# Namco Museum Megamix (native PC port) settings.  key = value,  '#' starts a comment.
# Full list: docs/OPTIONS.md section 3.

# Where your extracted game disc is: the "files" folder that holds the "museum" folder.
# With Dolphin: right-click the game > Properties > Filesystem > right-click the disc > Extract Entire Disc...
# The DATA folder Dolphin writes (or the folder above it) works too. Paths may start with ~/
# Without this line the game looks for a folder called "data" next to megamix.sh.
#data_root = ~/Games/Wii/Megamix/DATA/files

# The game's main.dol (optional: the debug font and two engine textures come from it).
# When unset, the game uses sys/main.dol next to the "files" folder of an extracted disc.
#dol_path = ~/Games/Wii/Megamix/DATA/sys/main.dol

# Your saves (the game's own Wii save format).
save_dir = save

# Sound: on / off, master volume 0..100.
audio = on
volume = 100
